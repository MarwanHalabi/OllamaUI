name: OllamaUI E2E on EC2

on:
  push:
    branches: [ main ]          # deploy & test after merge
  workflow_dispatch:             # manual trigger too

concurrency:
  group: ollama-ui-e2e
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      UI_TAG: ${{ steps.pick.outputs.TAG }}
      YOLO_TAG: ${{ steps.vars.outputs.YOLO_TAG }}
    env:
      UI_IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/my-lama

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.UI_IMAGE_REPO }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build & Push UI (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pick immutable UI tag
        id: pick
        run: |
          echo "TAG=$(echo '${{ steps.meta.outputs.tags }}' | tr ' ' '\n' | grep 'sha-' | head -n1 | sed 's/.*://')" >> $GITHUB_OUTPUT

      - name: Resolve YOLO tag (from repo variable or fallback)
        id: vars
        run: |
          echo "YOLO_TAG=${{ vars.YOLO_TAG || 'latest' }}" >> $GITHUB_OUTPUT

      - name: Ensure remote dir and Docker/Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            mkdir -p /home/ubuntu/yolo-stack
            if ! command -v docker >/dev/null; then
              sudo apt-get update && sudo apt-get install -y docker.io docker-compose-plugin
              sudo systemctl enable --now docker
              sudo usermod -aG docker ubuntu || true
            fi

      # (Optional) upload compose if you template it in repo:
      # - name: Upload docker-compose.yml
      #   uses: appleboy/scp-action@v0.1.7
      #   with:
      #     host: ${{ secrets.EC2_HOST }}
      #     username: ubuntu
      #     key: ${{ secrets.EC2_SSH_KEY }}
      #     source: "deploy/docker-compose.yml"
      #     target: "/home/ubuntu/yolo-stack/"

      - name: Deploy stack on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/yolo-stack

            # .env drives compose image tags:
            #   ollama-ui: marwanhalabi/my-lama:${OLLAMA_VERSION}
            #   yolo     : marwanhalabi/yolo-lama:${YOLO_VERSION}
            touch .env
            grep -q '^OLLAMA_VERSION=' .env && sed -i 's/^OLLAMA_VERSION=.*/OLLAMA_VERSION=${{ steps.pick.outputs.TAG }}/' .env || echo 'OLLAMA_VERSION=${{ steps.pick.outputs.TAG }}' >> .env
            grep -q '^YOLO_VERSION=' .env   && sed -i 's/^YOLO_VERSION=.*/YOLO_VERSION=${{ steps.vars.outputs.YOLO_TAG }}/' .env || echo 'YOLO_VERSION=${{ steps.vars.outputs.YOLO_TAG }}' >> .env

            # Pull & restart
            docker compose pull
            docker compose up -d --pull always

            # Wait for services
            for i in {1..60}; do curl -fsS http://localhost:8080/openapi.json && break || sleep 3; done
            for i in {1..60}; do curl -fsS http://localhost:3000/ && break || sleep 3; done

            docker compose ps
            docker compose logs --no-log-prefix --tail=80 yolo || true
            docker compose logs --no-log-prefix --tail=80 ollama-ui || true

  ui-tests:
    runs-on: ubuntu-latest
    needs: deploy
    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome, firefox ]
        resolution:
          - { name: desktop-full, width: 1920, height: 1080 }
          - { name: laptop,       width: 1366, height: 768 }
          - { name: mobile,       width: 375,  height: 667 }

    steps:
      - name: Checkout tests
        uses: actions/checkout@v4
        with:
          repository: MarwanHalabi/OllamaUITesting
          fetch-depth: 1
          token: ${{ secrets.UI_TESTING_GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install selenium pytest pytest-xdist allure-pytest webdriver-manager

      # Reliable browsers
      - name: Setup Chrome
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@v1
      - name: Setup ChromeDriver
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chromedriver@v1
      - name: Setup Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1
      - name: Setup GeckoDriver
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-geckodriver@v1

      - name: Allure env
        run: |
          mkdir -p allure-results
          cat > allure-results/environment.properties <<EOF
          BASE_URL=http://${{ secrets.EC2_HOST }}:3000
          BROWSER=${{ matrix.browser }}
          RESOLUTION=${{ matrix.resolution.width }}x${{ matrix.resolution.height }}
          OLLAMA_UI_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/my-lama:${{ needs.deploy.outputs.UI_TAG }}
          YOLO_IMAGE=marwanhalabi/yolo-lama:${{ needs.deploy.outputs.YOLO_TAG }}
          POSTGRES_IMAGE=postgres:15
          EOF

      - name: Run Selenium tests
        env:
          BASE_URL: http://${{ secrets.EC2_HOST }}:3000
          HEADLESS: "true"
          BROWSER: ${{ matrix.browser }}
          SCREEN_WIDTH: ${{ matrix.resolution.width }}
          SCREEN_HEIGHT: ${{ matrix.resolution.height }}
          TEST_NAME: ${{ matrix.browser }}-${{ matrix.resolution.name }}
        run: |
          pytest -q tests --alluredir=allure-results

      - name: Upload Allure results (per-matrix)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}-${{ matrix.resolution.name }}
          path: allure-results
          retention-days: 30

  allure-report:
    runs-on: ubuntu-latest
    needs: ui-tests
    if: always()
    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results-downloaded
          merge-multiple: false

      - name: Merge results
        run: |
          mkdir -p allure-results
          find allure-results-downloaded -type f -maxdepth 2 -print0 | xargs -0 -I{} cp -f {} allure-results/ || true

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history
          gh_pages: false

      - name: Upload Allure HTML
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
